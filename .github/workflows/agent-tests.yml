# .github/workflows/agent-tests.yml
# AgentShield CI/CD Pipeline - FIXED

name: AgentShield CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Force Node24 for actions (silences the deprecation warning)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-agent:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyyaml pandas numpy plotly
      
      - name: Start backend server
        run: |
          cd backend
          nohup uvicorn app:app --host 127.0.0.1 --port 8000 &
          sleep 8
          # Check if server is running
          curl http://127.0.0.1:8000/health || exit 1
      
      - name: Run test suite
        id: tests
        run: |
          python -c "
          import requests
          import time
          import json
          import sys
          
          BASE_URL = 'http://127.0.0.1:8000'
          
          print('🚀 Running AgentShield Test Suite...')
          print('=' * 50)
          
          # 1. Generate tests
          print('\n📝 Generating test scenarios...')
          try:
              resp = requests.post(f'{BASE_URL}/generate-tests', json={'count': 20}, timeout=30)
              if resp.status_code != 200:
                  print(f'❌ Generate tests failed: {resp.status_code}')
                  sys.exit(1)
              data = resp.json()
              print(f'✅ Generated {data[\"count\"]} test scenarios')
          except Exception as e:
              print(f'❌ Generate tests error: {e}')
              sys.exit(1)
          
          # 2. Run tests
          print('\n🏃 Running test suite...')
          try:
              resp = requests.post(f'{BASE_URL}/run-tests', timeout=120)
              if resp.status_code != 200:
                  print(f'❌ Run tests failed: {resp.status_code}')
                  print(f'Response: {resp.text[:200]}')
                  sys.exit(1)
              data = resp.json()
              report = data.get('report', {})
          except Exception as e:
              print(f'❌ Run tests error: {e}')
              sys.exit(1)
          
          # 3. Display results
          print('\n📊 Test Results:')
          print('=' * 50)
          print(f'   Overall Reliability: {report.get(\"overall_reliability\", 0)}%')
          print(f'   Safety Score: {report.get(\"safety_score\", 0)}%')
          print(f'   Passed: {report.get(\"passed\", 0)}/{report.get(\"total_tests\", 0)}')
          print(f'   Critical Failures: {report.get(\"critical_failures\", 0)}')
          
          # 4. Check for critical failures
          if report.get('critical_failures', 0) > 0:
              print('\n🚨 Critical failures found!')
              for rec in report.get('recommendations', [])[:3]:
                  print(f'   - {rec}')
              print('\n❌ Tests FAILED - Critical issues detected')
              sys.exit(1)
          elif report.get('passed', 0) < report.get('total_tests', 1):
              print('\n⚠️ Some tests failed but no critical issues')
              print('❌ Tests FAILED')
              sys.exit(1)
          else:
              print(f'\n✅ All {report.get(\"total_tests\", 0)} tests passed!')
              print(f'   Reliability Score: {report.get(\"overall_reliability\", 0)}%')
              print('✅ Tests PASSED')
              sys.exit(0)
          "
      
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentshield-test-report
          path: |
            *.json
            test-*.json
      
      - name: Stop backend server
        if: always()
        run: |
          pkill -f "uvicorn" || true
